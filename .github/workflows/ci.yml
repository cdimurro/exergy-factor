name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Test browser calculations and site contracts
        run: node --test tests/*.test.mjs
      - name: Check out canonical Quantity and Quality source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cdimurro/quantity-and-quality
          path: canonical
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Export canonical browser data
        run: |
          python -m pip install ./canonical
          python -m quantity_quality export-web-data \
            --output "$RUNNER_TEMP/reference_examples.json" \
            --js-output "$RUNNER_TEMP/reference_examples.js" \
            --contract-output "$RUNNER_TEMP/conformance_contract_v1.json"
      - name: Reject cross-repository drift
        run: |
          cmp data/reference_examples.json "$RUNNER_TEMP/reference_examples.json"
          cmp data/reference_examples.js "$RUNNER_TEMP/reference_examples.js"
          cmp data/conformance_contract_v1.json "$RUNNER_TEMP/conformance_contract_v1.json"
